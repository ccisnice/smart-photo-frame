<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>传照片到相框</title>
<link rel="icon" href="/icon.png" type="image/png">
<style>
  :root {
    --primary: #6366f1;
    --primary-hover: #4f46e5;
    --success: #10b981;
    --bg: #09090b;
    --card-bg: rgba(24, 24, 27, 0.85);
    --border: rgba(255, 255, 255, 0.1);
    --text: #f4f4f5;
    --text-muted: #a1a1aa;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px 16px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .container {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  header {
    text-align: center;
    padding: 10px 0 6px;
  }
  .app-icon {
    width: 64px;
    height: 64px;
    border-radius: 18px;
    margin-bottom: 12px;
    box-shadow: 0 8px 24px rgba(99, 102, 241, 0.25);
  }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
  p.subtitle { font-size: 14px; color: var(--text-muted); margin-top: 4px; }

  /* 状态指示卡片 */
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(16, 185, 129, 0.12);
    color: #34d399;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    align-self: center;
    border: 1px solid rgba(16, 185, 129, 0.2);
  }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; box-shadow: 0 0 8px #10b981; }

  /* 核心选择区域 */
  .upload-box {
    background: var(--card-bg);
    border: 2px dashed var(--border);
    border-radius: 20px;
    padding: 36px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s ease;
    backdrop-filter: blur(12px);
  }
  .upload-box:active {
    transform: scale(0.98);
    border-color: var(--primary);
    background: rgba(99, 102, 241, 0.08);
  }
  .upload-icon {
    font-size: 44px;
    margin-bottom: 12px;
    display: inline-block;
  }
  .upload-box h3 { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
  .upload-box p { font-size: 13px; color: var(--text-muted); }
  .compress-tag {
    display: inline-block;
    margin-top: 10px;
    font-size: 11px;
    background: rgba(99, 102, 241, 0.15);
    color: #a5b4fc;
    padding: 3px 8px;
    border-radius: 6px;
  }

  /* 隐藏原生 input */
  #file-input { display: none; }

  /* 预览与待传列表 */
  .queue-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 16px;
    display: none;
    flex-direction: column;
    gap: 14px;
  }
  .queue-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    font-weight: 600;
  }
  .queue-stats {
    font-size: 12px;
    color: #34d399;
    font-weight: normal;
  }
  .preview-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    max-height: 240px;
    overflow-y: auto;
    padding: 4px 2px;
  }
  .preview-item {
    position: relative;
    aspect-ratio: 1;
    border-radius: 12px;
    overflow: hidden;
    background: #18181b;
  }
  .preview-item img, .preview-item video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .preview-item .size-tag {
    position: absolute;
    bottom: 4px;
    left: 4px;
    right: 4px;
    background: rgba(0,0,0,0.7);
    color: #fff;
    font-size: 10px;
    padding: 2px 4px;
    border-radius: 4px;
    text-align: center;
  }

  /* 上传操作栏 */
  .action-bar {
    display: flex;
    gap: 10px;
  }
  .btn {
    flex: 1;
    height: 48px;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--primary), #a855f7);
    color: #fff;
    box-shadow: 0 4px 16px rgba(99, 102, 241, 0.35);
  }
  .btn-primary:active { transform: scale(0.97); opacity: 0.9; }
  .btn-secondary {
    background: rgba(255, 255, 255, 0.08);
    color: var(--text);
  }

  /* 进度指示条 */
  .progress-wrap {
    display: none;
    flex-direction: column;
    gap: 8px;
  }
  .progress-bar-bg {
    width: 100%;
    height: 8px;
    background: rgba(255,255,255,0.1);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #6366f1, #10b981);
    transition: width 0.2s ease;
  }
  .progress-text {
    font-size: 13px;
    color: var(--text-muted);
    text-align: center;
  }

  /* 成功弹窗/提示 */
  .toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: #18181b;
    border: 1px solid rgba(16, 185, 129, 0.4);
    color: #fff;
    padding: 12px 20px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 500;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 100;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="toast" id="toast">
  <span>🎉</span>
  <span id="toast-msg">已成功发送到相框！</span>
</div>

<div class="container">
  <header>
    <img src="/icon.png" class="app-icon" alt="相框">
    <h1>智能相框 · 手机投送</h1>
    <p class="subtitle">选择照片或视频，自动无线同步到客厅平板</p>
  </header>

  <div class="status-badge" id="conn-status">
    <div class="status-dot"></div>
    <span id="conn-text">已连接到平板相框</span>
  </div>

  <!-- 选择入口 -->
  <div class="upload-box" id="drop-zone">
    <span class="upload-icon">📸</span>
    <h3>点击选择手机照片 / 视频</h3>
    <p>支持多选，单次可上传几十张</p>
    <div class="compress-tag">⚡ 自动启用 2K 智能压缩 (节省95%空间)</div>
  </div>
  <input type="file" id="file-input" multiple accept="image/*,video/*">

  <!-- 待上传队列卡片 -->
  <div class="queue-card" id="queue-card">
    <div class="queue-header">
      <span id="queue-title">待发送 (0)</span>
      <span class="queue-stats" id="queue-stats">预估节省 0MB</span>
    </div>

    <div class="preview-grid" id="preview-grid"></div>

    <div class="progress-wrap" id="progress-wrap">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <div class="progress-text" id="progress-text">准备中...</div>
    </div>

    <div class="action-bar" id="action-bar">
      <button class="btn btn-secondary" id="btn-cancel">清空</button>
      <button class="btn btn-primary" id="btn-upload">🚀 一键发射到相框</button>
    </div>
  </div>

  <!-- 相框相册管理卡片 -->
  <div class="manage-card" style="background:var(--card-bg);border:1px solid var(--border);border-radius:20px;padding:18px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <h3 style="font-size:15px;font-weight:600;">🖼️ 相框中现有的照片 (<span id="existing-count">0</span>)</h3>
      <button id="btn-refresh-list" style="background:none;border:none;color:#818cf8;font-size:13px;cursor:pointer;">刷新</button>
    </div>
    <div id="existing-grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-height:300px;overflow-y:auto;padding:2px;">
      <!-- 动态加载照片与删除按钮 -->
    </div>
  </div>

  <!-- 安卓 App 下载专区 -->
  <div style="text-align:center;margin-top:16px;padding:14px;background:rgba(99,102,241,0.08);border:1px solid rgba(99,102,241,0.2);border-radius:18px;">
    <p style="font-size:13px;color:#a1a1aa;margin-bottom:8px;">想把闲置安卓平板或旧手机变成独立相框？</p>
    <a href="/app.apk" download="智能相框.apk" style="display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;text-decoration:none;padding:10px 20px;border-radius:24px;font-size:14px;font-weight:600;box-shadow:0 4px 15px rgba(99,102,241,0.35);">
      🤖 点击直接下载安卓 App (.apk)
    </a>
  </div>
</div>

<script>
const fileInput = document.getElementById('file-input');
const dropZone = document.getElementById('drop-zone');
const queueCard = document.getElementById('queue-card');
const previewGrid = document.getElementById('preview-grid');
const queueTitle = document.getElementById('queue-title');
const queueStats = document.getElementById('queue-stats');
const btnUpload = document.getElementById('btn-upload');
const btnCancel = document.getElementById('btn-cancel');
const progressWrap = document.getElementById('progress-wrap');
const progressFill = document.getElementById('progress-fill');
const progressText = document.getElementById('progress-text');
const toast = document.getElementById('toast');
const toastMsg = document.getElementById('toast-msg');

let rawFiles = [];
let processedFiles = []; // { name, blob, originalSize, compressedSize, previewUrl }

// 点击唤起文件选择
dropZone.onclick = () => fileInput.click();

fileInput.onchange = async (e) => {
  if (!e.target.files.length) return;
  await handleFiles(Array.from(e.target.files));
};

// 核心功能：前端 Canvas 智能压缩图片 (2K 视网膜适配)
async function compressImage(file, maxDimension = 2048, quality = 0.85) {
  return new Promise((resolve) => {
    // 非图片类型（如视频或动图 GIF）不走有损压缩
    if (!file.type.startsWith('image/') || file.type === 'image/gif') {
      return resolve({ blob: file, width: 0, height: 0, compressed: false });
    }

    const img = new Image();
    const url = URL.createObjectURL(file);
    img.src = url;

    img.onload = () => {
      URL.revokeObjectURL(url);
      let { width, height } = img;

      // 如果尺寸超过 2048px，进行等比缩小
      if (width > maxDimension || height > maxDimension) {
        if (width > height) {
          height = Math.round((height * maxDimension) / width);
          width = maxDimension;
        } else {
          width = Math.round((width * maxDimension) / height);
          height = maxDimension;
        }
      }

      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);

      // 优先使用普遍兼容、压缩效率极高的 JPEG 格式 (质量 0.82)
      canvas.toBlob((blob) => {
        if (blob) {
          resolve({ blob, width, height, compressed: true });
        } else {
          resolve({ blob: file, width: 0, height: 0, compressed: false });
        }
      }, 'image/jpeg', 0.82);
    };

    img.onerror = () => resolve({ blob: file, width: 0, height: 0, compressed: false });
  });
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

async function handleFiles(files) {
  rawFiles = files;
  processedFiles = [];
  previewGrid.innerHTML = '';
  queueCard.style.display = 'flex';
  btnUpload.disabled = true;
  btnUpload.textContent = '⏳ 智能优化中...';

  let totalOriginal = 0;
  let totalCompressed = 0;

  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    totalOriginal += f.size;
    const { blob, compressed } = await compressImage(f);
    totalCompressed += blob.size;

    // 修改扩展名为 jpg (若已压缩)
    let finalName = f.name;
    if (compressed && !finalName.toLowerCase().endsWith('.jpg') && !finalName.toLowerCase().endsWith('.jpeg')) {
      const dotIdx = finalName.lastIndexOf('.');
      finalName = (dotIdx > 0 ? finalName.slice(0, dotIdx) : finalName) + '.jpg';
    }

    const previewUrl = URL.createObjectURL(blob);
    processedFiles.push({
      name: finalName,
      blob,
      originalSize: f.size,
      compressedSize: blob.size,
      previewUrl,
      isVideo: f.type.startsWith('video/')
    });

    const domItem = document.createElement('div');
    domItem.className = 'preview-item';
    if (f.type.startsWith('video/')) {
      domItem.innerHTML = `<video src="${previewUrl}" muted></video><div class="size-tag">视频 ${formatSize(blob.size)}</div>`;
    } else {
      const saved = Math.round((1 - blob.size / f.size) * 100);
      const tagText = saved > 0 ? `省 ${saved}%` : formatSize(blob.size);
      domItem.innerHTML = `<img src="${previewUrl}"><div class="size-tag">${tagText}</div>`;
    }
    previewGrid.appendChild(domItem);

    processedFiles.push({
      name: finalName,
      blob,
      originalSize: f.size,
      compressedSize: blob.size,
      previewUrl,
      isVideo: f.type.startsWith('video/'),
      domEl: domItem
    });
  }

  const savedMb = ((totalOriginal - totalCompressed) / (1024 * 1024)).toFixed(1);
  queueTitle.textContent = `待发送 (${processedFiles.length} 项)`;
  queueStats.textContent = savedMb > 0 ? `已优化缩减 ${savedMb} MB 空间` : '';
  btnUpload.disabled = false;
  btnUpload.textContent = `🚀 一键发射 (${formatSize(totalCompressed)})`;
}

// 清空列表
btnCancel.onclick = () => {
  processedFiles.forEach(p => URL.revokeObjectURL(p.previewUrl));
  processedFiles = [];
  rawFiles = [];
  queueCard.style.display = 'none';
  fileInput.value = '';
};

function uploadFileWithProgress(item, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', `/api/upload?filename=${encodeURIComponent(item.name)}`);
    xhr.setRequestHeader('Content-Type', item.blob.type || 'application/octet-stream');
    xhr.setRequestHeader('X-Filename', encodeURIComponent(item.name));

    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) {
        onProgress(e.loaded, e.total);
      }
    };

    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) {
        resolve(true);
      } else {
        reject(new Error(xhr.statusText || 'Upload failed'));
      }
    };

    xhr.onerror = () => reject(new Error('Network error'));
    xhr.send(item.blob);
  });
}

// 批量上传：每传完一个，立刻从待发区消除并实时显示
btnUpload.onclick = async () => {
  if (!processedFiles.length) return;

  btnUpload.disabled = true;
  btnCancel.disabled = true;
  progressWrap.style.display = 'flex';

  let successCount = 0;
  const initialTotal = processedFiles.length;

  while (processedFiles.length > 0) {
    const item = processedFiles[0];
    const currentIndex = successCount + 1;
    progressText.textContent = `准备传输 (${currentIndex}/${initialTotal}): ${item.name}...`;

    try {
      await uploadFileWithProgress(item, (loaded, fileTotal) => {
        const filePct = Math.round((loaded / fileTotal) * 100);
        const loadedMb = (loaded / (1024 * 1024)).toFixed(1);
        const totalMb = (fileTotal / (1024 * 1024)).toFixed(1);
        const overallPct = Math.round(((successCount + (loaded / fileTotal)) / initialTotal) * 100);
        progressFill.style.width = overallPct + '%';
        progressText.textContent = `正在传输 (${currentIndex}/${initialTotal}): ${loadedMb}MB / ${totalMb}MB (${filePct}%)`;
      });

      successCount++;

      // 核心体验提升：成功传完一张，立刻动画缩小消失并从队列中抹除！
      if (item.domEl && item.domEl.parentNode) {
        item.domEl.style.transition = 'all 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
        item.domEl.style.opacity = '0';
        item.domEl.style.transform = 'scale(0.3)';
        setTimeout(() => {
          if (item.domEl && item.domEl.parentNode) {
            item.domEl.parentNode.removeChild(item.domEl);
          }
        }, 300);
      }
      URL.revokeObjectURL(item.previewUrl);
      processedFiles.shift(); // 从待发送列表中移除已完成的文件

      queueTitle.textContent = `待发送 (${processedFiles.length} 项)`;
      loadExistingMedia();
      checkStatus();

    } catch (e) {
      console.error('上传失败', e);
      showToast(`⚠️ 文件 ${item.name} 传输失败`);
      if (item.domEl) {
        item.domEl.style.border = '2px solid #ef4444';
      }
      // 遇到网络中断失败，保留剩余未传文件，退出循环允许用户重试
      break;
    }
  }

  progressFill.style.width = '100%';

  if (processedFiles.length === 0) {
    progressText.textContent = '全部发送完成！';
    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
    showToast(`🎉 成功同步 ${successCount} 个文件到相框！`);

    setTimeout(() => {
      btnCancel.click();
      btnCancel.disabled = false;
      btnUpload.disabled = false;
      progressWrap.style.display = 'none';
      loadExistingMedia();
    }, 1200);
  } else {
    // 存在未上传完的文件
    btnCancel.disabled = false;
    btnUpload.disabled = false;
    btnUpload.textContent = `🔄 重新发送剩余 (${processedFiles.length} 项)`;
    progressText.textContent = `已成功发送 ${successCount} 项，剩余 ${processedFiles.length} 项`;
  }
};

function showToast(msg) {
  toastMsg.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3500);
}

const existingCount = document.getElementById('existing-count');
const existingGrid = document.getElementById('existing-grid');
const btnRefreshList = document.getElementById('btn-refresh-list');

async function loadExistingMedia() {
  try {
    const res = await fetch('/api/media');
    if (res.ok) {
      const list = await res.json();
      existingCount.textContent = list.length;
      existingGrid.innerHTML = '';
      if (!list.length) {
        existingGrid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--text-muted);font-size:13px;padding:16px;">相框里暂无照片</div>';
        return;
      }
      list.forEach(item => {
        const div = document.createElement('div');
        div.style.position = 'relative';
        div.style.aspectRatio = '1';
        div.style.borderRadius = '12px';
        div.style.overflow = 'hidden';
        div.style.background = '#18181b';

        const mediaEl = item.type === 'video'
          ? `<video src="${item.url}" muted style="width:100%;height:100%;object-fit:cover;"></video>`
          : `<img src="${item.url}" style="width:100%;height:100%;object-fit:cover;">`;

        div.innerHTML = `
          ${mediaEl}
          <div style="position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,0.65);padding:2px 4px;font-size:10px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;">${item.name}</div>
          <button class="btn-del-item" data-name="${encodeURIComponent(item.name)}" style="position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:13px;background:rgba(239,68,68,0.9);color:#fff;border:none;cursor:pointer;font-size:12px;font-weight:bold;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,0.4);">✕</button>
        `;

        div.querySelector('.btn-del-item').onclick = async (e) => {
          e.stopPropagation();
          if (confirm(`确定要从相框删除照片「${item.name}」吗？`)) {
            try {
              const dRes = await fetch(`/api/delete?name=${encodeURIComponent(item.name)}`, { method: 'POST' });
              if (dRes.ok) {
                showToast(`已删除：${item.name}`);
                loadExistingMedia();
                checkStatus();
              } else {
                alert('删除失败');
              }
            } catch (err) {
              alert('网络错误');
            }
          }
        };

        existingGrid.appendChild(div);
      });
    }
  } catch (e) {
    console.error('加载相册列表失败', e);
  }
}

btnRefreshList.onclick = loadExistingMedia;

// 检查连接
async function checkStatus() {
  try {
    const res = await fetch('/api/info');
    if (res.ok) {
      const info = await res.json();
      document.getElementById('conn-text').textContent = `已连接 · 相框当前共 ${info.media_count} 张照片`;
    }
  } catch (e) {
    document.getElementById('conn-text').textContent = '未连接到相框 (请确认处于同个WiFi)';
    document.getElementById('conn-status').style.color = '#ef4444';
  }
}
checkStatus();
loadExistingMedia();
</script>
</body>
</html>
